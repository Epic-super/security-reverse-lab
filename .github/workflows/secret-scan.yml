name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for leaked credentials and real targets
        run: |
          fail=0

          echo "== token / key patterns =="
          if grep -rInE "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" . \
            --exclude-dir=.git; then
            echo "::error::Potential credential found. Replace with <REDACTED>."
            fail=1
          fi

          echo "== real target hostnames =="
          if grep -rInE "https?://[a-z0-9.-]+\.(com|cn|net|io|top|xyz|cc|vip)(:[0-9]+)?" . \
            --exclude-dir=.git \
            --exclude="*.md" --exclude="*.json" --exclude="*.yml"; then
            echo "::error::Live hostname found. Use TARGET / example.com / TARGET_IP."
            fail=1
          fi

          echo "== real QQ email =="
          if grep -rIn "3315874081@qq.com" . --exclude-dir=.git; then
            echo "::error::Real email found in tracked files."
            fail=1
          fi

          exit $fail
